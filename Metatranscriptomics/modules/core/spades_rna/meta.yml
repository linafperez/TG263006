name: spades_rna

description: Perform de novo coassembly of filtered non-human metatranscriptomic reads using rnaSPAdes.

keywords:
  - assembly
  - transcriptome
  - metatranscriptomics
  - rna
  - coassembly

tools:
  - spades:
      description: SPAdes genome assembler with RNA-seq assembly mode
      homepage: https://github.com/ablab/spades
      documentation: https://ablab.github.io/spades/

input:
  - reads:
      type: file
      description: Paired-end non-human FASTQ files from all samples included in the coassembly.
      pattern: "*_non_human_R{1,2}.fastq.gz"

  - assembly_id:
      type: string
      description: Identifier assigned to the coassembly.

  - outdir_name:
      type: string
      description: Name of the output directory for the coassembly results.

output:
  - transcripts:
      type: file
      description: Transcript contigs generated by rnaSPAdes.
      pattern: "*_transcripts.fasta"

  - log:
      type: file
      description: rnaSPAdes execution log.
      pattern: "*_spades.log"

  - dataset:
      type: file
      description: Dataset definition containing all paired-end libraries used for the coassembly.
      pattern: "*_dataset.yaml"

  - versions:
      type: file
      description: SPAdes software version.
      pattern: "*_versions.yml"

authors:
  - "Gabriela Bonilla"
