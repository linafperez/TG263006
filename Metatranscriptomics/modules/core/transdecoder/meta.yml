name: transdecoder

description: Predict coding regions and protein sequences from assembled metatranscriptomic transcripts using TransDecoder.

keywords:
  - transdecoder
  - ORF prediction
  - coding regions
  - transcriptome
  - metatranscriptomics
  - protein prediction

tools:
  - transdecoder:
      description: Identify candidate coding regions within transcript sequences
      homepage: https://github.com/TransDecoder/TransDecoder
      documentation: https://github.com/TransDecoder/TransDecoder/wiki

input:
  - transcripts:
      type: file
      description: Transcript assembly generated by rnaSPAdes.
      pattern: "*_transcripts.fasta"

  - assembly_id:
      type: string
      description: Identifier assigned to the transcript assembly.

  - outdir_name:
      type: string
      description: Name of the output directory for TransDecoder results.

output:
  - pep:
      type: file
      description: Predicted protein sequences.
      pattern: "*.transdecoder.pep"

  - cds:
      type: file
      description: Predicted coding DNA sequences.
      pattern: "*.transdecoder.cds"

  - gff3:
      type: file
      description: GFF3 annotation of predicted coding regions.
      pattern: "*.transdecoder.gff3"

  - transdecoder_dir:
      type: directory
      description: Working directory containing intermediate TransDecoder results.

  - versions:
      type: file
      description: TransDecoder software version.
      pattern: "*_transdecoder_versions.yml"

authors:
  - "Gabriela Bonilla"
