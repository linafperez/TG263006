name: rnaquast

description: Assess the quality of the de novo metatranscriptomic assembly generated by rnaSPAdes using rnaQUAST.

keywords:
  - assembly
  - quality control
  - transcriptome
  - metatranscriptomics
  - rnaquast

tools:
  - rnaquast:
      description: Quality assessment tool for de novo transcriptome assemblies
      homepage: https://github.com/ablab/rnaquast
      documentation: https://github.com/ablab/rnaquast

input:
  - transcripts:
      type: file
      description: Transcript assembly generated by rnaSPAdes.
      pattern: "*_transcripts.fasta"

  - assembly_id:
      type: string
      description: Identifier assigned to the assembly.

  - outdir_name:
      type: string
      description: Name of the output directory for the rnaQUAST results.

output:
  - report_dir:
      type: directory
      description: Directory containing all rnaQUAST quality assessment results.

  - txt:
      type: file
      description: Short text summary generated by rnaQUAST.
      pattern: "short_report.txt"

  - pdf:
      type: file
      description: PDF summary generated by rnaQUAST.
      pattern: "short_report.pdf"

  - tex:
      type: file
      description: LaTeX summary generated by rnaQUAST.
      pattern: "short_report.tex"

  - versions:
      type: file
      description: rnaQUAST software version.
      pattern: "*_versions.yml"

authors:
  - "Gabriela Bonilla"
