name: multiqc
description: Aggregate quality-control and pipeline metrics into a single MultiQC report.
keywords:
  - multiqc
  - quality control
  - reporting
  - metatranscriptomics
  - qc

tools:
  - multiqc:
      description: |
        MultiQC aggregates results from bioinformatics analyses across many samples
        into a single interactive HTML report.
      homepage: https://multiqc.info/
      documentation: https://docs.seqera.io/multiqc/
      licence: ["GPL-3.0-or-later"]

input:
  - multiqc_files:
      type: file
      description: |
        Collected files and directories from supported pipeline tools to be parsed
        by MultiQC. These may include FastQC archives, fastp JSON reports,
        SortMeRNA logs, STAR logs, rnaQUAST custom-content YAML, DIAMOND logs,
        and Salmon quantification directories.

output:
  - html:
      type: file
      description: |
        Final interactive MultiQC HTML report.
      pattern: "multiqc_report.html"

  - data:
      type: directory
      description: |
        MultiQC data directory containing parsed metrics, tables, logs,
        and exported plot data.
      pattern: "multiqc_data"

  - versions:
      type: file
      description: |
        File containing the MultiQC software version.
      pattern: "multiqc_versions.yml"

authors:
  - "Gabriela Bonilla"
