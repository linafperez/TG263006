name: "quality_control"
description: Perform quality assessment, read trimming and post-trimming quality control on paired-end sequencing reads.
keywords:
  - quality_control
  - fastqc
  - fastp
  - trimming
  - fastq
components:
  - fastqc
  - fastp
input:
  - reads_ch:
      type: tuple
      description: |
        Channel containing sample metadata and paired-end FASTQ reads.
        Structure: [ val(meta), [ path(read1), path(read2) ] ]
output:
  - trimmed_reads:
      type: tuple
      description: |
        Channel containing sample metadata and trimmed paired-end reads.
        Structure: [ val(meta), [ path(read1), path(read2) ] ]
  - fastqc_raw_html:
      type: file
      description: |
        FastQC HTML reports generated from raw sequencing reads.
      pattern: "*.html"
  - fastqc_clean_html:
      type: file
      description: |
        FastQC HTML reports generated from trimmed sequencing reads.
      pattern: "*.html"
  - fastqc_raw_zip:
      type: file
      description: |
        FastQC result archives generated from raw sequencing reads.
      pattern: "*.zip"
  - fastqc_clean_zip:
      type: file
      description: |
        FastQC result archives generated from trimmed sequencing reads.
      pattern: "*.zip"
  - fastp_html:
      type: file
      description: |
        HTML quality and trimming report generated by fastp.
      pattern: "*.html"
authors:
  - "Gabriela Bonilla"
