name: "assembly"
description: Co-assemble non-human metatranscriptomic reads with rnaSPAdes and assess the resulting transcript assembly with QUAST.
keywords:
  - assembly
  - rnaspades
  - spades
  - quast
  - transcriptome
  - metatranscriptomics
components:
  - spades_rna
  - quast
input:
  - non_human_reads_ch:
      type: tuple
      description: |
        Channel containing paired-end reads remaining after rRNA and host removal.
output:
  - transcripts:
      type: file
      description: |
        Transcript sequences generated by the rnaSPAdes co-assembly.
      pattern: "*.fasta"
  - spades_log:
      type: file
      description: |
        rnaSPAdes execution log.
      pattern: "*.log"
  - quast_report:
      type: directory
      description: |
        Directory containing QUAST assembly quality reports.
  - spades_versions:
      type: file
      description: |
        File containing the rnaSPAdes software version.
      pattern: "*.yml"
  - quast_versions:
      type: file
      description: |
        File containing the QUAST software version.
      pattern: "*.yml"
authors:
  - "Gabriela Bonilla"
